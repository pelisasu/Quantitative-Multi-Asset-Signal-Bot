name: Quant Signal Bot v2

on:
  schedule:
    # Live lightweight scan every 15 minutes
    - cron: "*/15 * * * *"
    # Daily walk-forward calibration at 00:05 UTC
    - cron: "5 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode (live | backtest | both)"
        required: true
        default: "live"

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy pandas requests yfinance matplotlib

      - name: Run Signal Bot v2
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python bot_hardened.py --mode "${{ github.event.inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "5 0 * * *" ]; then
            python bot_hardened.py --mode backtest
          else
            python bot_hardened.py --mode live
          fi

      - name: Persist SQLite state & calibrated params
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trading_signals.db calibrated_params.json backtest_performance_v2.png || true
          git diff --staged --quiet || git commit -m "chore: update signal state & calibration"
          git push
