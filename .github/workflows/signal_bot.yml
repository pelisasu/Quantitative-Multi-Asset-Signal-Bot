name: Quantitative Multi-Asset Signal Bot

on:
  schedule:
    # Live scan + /check polling setiap 5 menit
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode (live | backtest | both | check)"
        required: true
        default: "live"
        type: choice
        options:
          - live
          - backtest
          - both
          - check

concurrency:
  # Mencegah race condition pada SQLite saat cron berjalan bersamaan
  group: quant-signal-bot-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Quantitative Signal Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BOT_BALANCE: ${{ secrets.BOT_BALANCE || '10000.0' }}
        run: |
          MODE="${{ github.event.inputs.mode || 'live' }}"
          python main.py --mode "$MODE"

      - name: Persist SQLite State & Calibrated Params
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f trading_signals.db calibrated_params.json backtest_performance_v3.png 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(state): update signals db & params [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push
          fi
