name: VOL_100 Dual-Mode Signal Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force_backtest:
        description: "Paksa jalankan ulang Walk-Forward Backtest & Chart"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: vol100-signal-bot-state
  cancel-in-progress: false

jobs:
  run-signal-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore SQLite state & Backtest Chart
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: |
            trading_signals.db
            backtest_performance.png
          key: vol100-state-${{ github.run_id }}
          restore-keys: |
            vol100-state-

      - name: Run VOL_100 Signal Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE_BACKTEST: ${{ github.event.inputs.force_backtest || 'false' }}
          TZ: "UTC"
        run: |
          python bot.py

      - name: Save SQLite state & Backtest Chart
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            trading_signals.db
            backtest_performance.png
          key: vol100-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Artifacts (DB, Chart & Forensic Log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vol100-run-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            trading_signals.db
            backtest_performance.png
            forensic_audit.log
